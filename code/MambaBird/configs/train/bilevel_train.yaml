# 双层优化训练循环基础配置（内层梯度下降 + 外层强化学习）
bilevel_train:
  inner_loop:
    optimizer: "adamw"
    learning_rate: 1.0e-3
    steps_per_outer_iteration: 100

  outer_loop:
    optimizer: "ppo"
    learning_rate: 3.0e-4
    steps_per_outer_iteration: 1

  total_outer_iterations: 50
  device: "cuda"

  reproducibility:
    random_seed: 42
    deterministic: true
