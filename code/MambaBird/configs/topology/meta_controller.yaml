# 强化学习元控制器（动态拓扑收缩策略）基础配置
meta_controller:
  mode: "heuristic"          # 可选: "heuristic"（启发式基线） / "rl"（强化学习策略）

  heuristic:
    initial_shrink_strength: 1.0
    decay_rate: 0.95
    decay_interval_epochs: 5

  rl:
    algorithm: "ppo"
    state_dim: 16             # 认知负荷度量的状态维度
    action_dim: 1             # 拓扑收缩强度（连续值）
    learning_rate: 3.0e-4
    discount_factor: 0.99
